<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Motion &amp; States of Matter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        #simCanvas {
            width: 100%;
            max-width: 800px;
            height: auto;
            aspect-ratio: 800 / 500;
            border-radius: 0.75rem;
            background-color: #020617;
            display: block;
        }
        .lang-btn.active {
            background-color: #308a8f;
            border-color: #308a8f;
            color: #ffffff;
        }
        .sub-btn.active {
            background-color: #308a8f;
            border-color: #308a8f;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 px-4 py-4">
        <div>
            <h1 class="text-2xl font-bold" data-i18n="headerTitle"></h1>
            <p class="text-slate-400 text-sm mt-1" data-i18n="headerSubtitle"></p>
        </div>
        <div class="flex gap-2">
            <button type="button" class="lang-btn border rounded-lg px-3 py-1.5 text-sm transition-colors" data-lang-btn="en-US">EN</button>
            <button type="button" class="lang-btn border rounded-lg px-3 py-1.5 text-sm transition-colors" data-lang-btn="zh-HK">繁</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_360px] gap-6 px-4 py-6">
        <!-- Left column: canvas + controls -->
        <div class="space-y-5">
            <div class="border border-slate-700 bg-slate-800/70 rounded-xl p-4">
                <canvas id="simCanvas" width="800" height="500"></canvas>
            </div>

            <div class="border border-slate-700 bg-slate-800/70 rounded-xl p-4">
                <label class="block text-sm font-medium text-slate-200" data-i18n="substanceLabel"></label>
                <div class="mt-2 flex gap-2">
                    <button type="button" class="sub-btn border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors" data-sub="water" data-i18n="subWater"></button>
                    <button type="button" class="sub-btn border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors" data-sub="nitrogen" data-i18n="subNitrogen"></button>
                    <button type="button" class="sub-btn border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors" data-sub="argon" data-i18n="subArgon"></button>
                </div>
                <label class="block text-sm font-medium text-slate-200 mt-4" data-i18n="tempLabel"></label>
                <div class="mt-2 flex items-center gap-3 flex-wrap">
                    <input type="range" id="tempSlider" min="1" max="500" step="1" value="300"
                        class="w-full flex-1 min-w-0 accent-emerald-400">
                    <span id="tempReadout" class="text-lg font-semibold tabular-nums">T = 300 K (27 &deg;C)</span>
                </div>
                <p class="text-xs text-slate-400 mt-2" data-i18n="sliderHint"></p>
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mt-3">
                    <button type="button" data-preset="1" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">1 K</button>
                    <button type="button" data-preset="100" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">100 K</button>
                    <button type="button" data-preset="273" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">273 K</button>
                    <button type="button" data-preset="300" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">300 K</button>
                    <button type="button" data-preset="373" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">373 K</button>
                    <button type="button" data-preset="500" class="preset border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors">500 K</button>
                </div>
                <div class="flex gap-2 mt-3">
                    <button type="button" id="pauseBtn" class="flex-1 border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors" data-i18n="pauseBtn"></button>
                    <button type="button" id="resetBtn" class="flex-1 border border-slate-700 rounded-lg py-1.5 text-sm text-slate-300 hover:border-emerald-400 hover:text-white transition-colors" data-i18n="resetBtn"></button>
                </div>
            </div>
        </div>

        <!-- Right column: info -->
        <div class="space-y-5">
            <div class="border border-slate-700 bg-slate-800/70 rounded-xl p-4">
                <div class="flex items-center justify-between gap-3">
                    <span class="text-sm font-medium text-slate-200" data-i18n="stateLabel"></span>
                    <span id="stateText" class="text-sm font-semibold text-amber-300">Liquid</span>
                </div>
                <dl class="mt-4 space-y-3 text-sm">
                    <div class="flex justify-between gap-2">
                        <dt class="text-slate-400" data-i18n="keLabel"></dt>
                        <dd>
                            <span class="tabular-nums text-white font-medium" id="keValue"></span>
                            <span class="text-slate-400 ml-1" data-i18n="keUnit"></span>
                        </dd>
                    </div>
                    <div class="flex justify-between gap-2">
                        <dt class="text-slate-400" data-i18n="rmsLabel"></dt>
                        <dd>
                            <span class="tabular-nums text-white font-medium" id="rmsValue"></span>
                            <span class="text-slate-400 ml-1" data-i18n="rmsUnit"></span>
                        </dd>
                    </div>
                </dl>
                <div class="flex items-center gap-3 mt-4">
                    <dt class="text-slate-400 shrink-0" data-i18n="structLabel"></dt>
                    <dd class="text-slate-300 min-w-0" id="structText"></dd>
                </div>
            </div>

            <div class="border border-slate-700 bg-slate-800/70 rounded-xl p-4">
                <h2 class="text-sm font-semibold text-slate-100" data-i18n="infoHeading"></h2>
                <p class="text-sm text-slate-300 mt-2 leading-relaxed" data-i18n="infoText"></p>
            </div>
        </div>
    </main>

    <script>
        /* ---------------- Translations ---------------- */
        const translations = {
            "en-US": {
                pageTitle: "Particle Motion & States of Matter",
                headerTitle: "Particle Motion & States of Matter",
                headerSubtitle: "Explore how particles move and arrange themselves from 1 K to 500 K — compare water (H₂O), nitrogen (N₂) and argon (Ar).",
                substanceLabel: "Substance",
                subWater: "Water (H₂O)",
                subNitrogen: "Nitrogen (N₂)",
                subArgon: "Argon (Ar)",
                tempLabel: "Temperature",
                sliderHint: "Drag to change temperature (1 K – 500 K)",
                stateLabel: "State",
                stateSolid: "Solid",
                stateLiquid: "Liquid",
                stateGas: "Gas",
                melting: "Melting…",
                boiling: "Boiling…",
                freezing: "Freezing…",
                condensing: "Condensing…",
                desubliming: "Depositing…",
                keLabel: "Avg. KE per particle",
                keUnit: "×10⁻²¹ J",
                rmsLabel: "RMS particle speed",
                rmsUnit: "m/s",
                structLabel: "Particle arrangement",
                structSolid: "Particles held in a fixed, ordered lattice, only vibrating in place.",
                structLiquid: "Particles close together, randomly arranged, sliding past each other.",
                structGas: "Particles far apart, moving rapidly and randomly in all directions.",
                pauseBtn: "Pause",
                resumeBtn: "Resume",
                resetBtn: "Reset Simulation",
                infoHeading: "💡 What you are seeing",
                infoText: "Temperature is a measure of the average kinetic energy of the particles: the hotter the sample, the faster its particles move. During melting and boiling the temperature stays constant because the energy supplied goes into separating the particles, not into speeding them up."
            },
            "zh-HK": {
                pageTitle: "粒子運動與物態",
                headerTitle: "粒子運動與物態",
                headerSubtitle: "探索粒子在 1 K 至 500 K 之間的運動與排列，比較水（H₂O）、氮（N₂）與氬（Ar）。",
                substanceLabel: "物質",
                subWater: "水（H₂O）",
                subNitrogen: "氮（N₂）",
                subArgon: "氬（Ar）",
                tempLabel: "溫度",
                sliderHint: "拖曳以改變溫度（1 K – 500 K）",
                stateLabel: "狀態",
                stateSolid: "固態",
                stateLiquid: "液態",
                stateGas: "氣態",
                melting: "熔化中…",
                boiling: "沸騰中…",
                freezing: "凝固中…",
                condensing: "凝結中…",
                desubliming: "凝華中…",
                keLabel: "每個粒子的平均動能",
                keUnit: "×10⁻²¹ 焦耳",
                rmsLabel: "粒子均方根速率",
                rmsUnit: "米/秒",
                structLabel: "粒子排列",
                structSolid: "粒子固定在有序晶格中，只能在原位振動。",
                structLiquid: "粒子緊密相貼但排列混亂，可互相滑過。",
                structGas: "粒子相距甚遠，向各個方向急速隨機運動。",
                pauseBtn: "暫停",
                resumeBtn: "繼續",
                resetBtn: "重置模擬",
                infoHeading: "💡 你看到甚麼",
                infoText: "溫度是粒子平均動能的度量：樣本越熱，粒子運動越快。熔化和沸騰期間溫度保持不變，因為輸入的能量用於把粒子分開，而不是加快粒子運動。"
            }
        };

        /* ---------------- i18n ---------------- */
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || 'en-US';
        if (!translations[currentLang]) currentLang = 'en-US';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.documentElement.lang = lang;
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', lang);
            window.history.pushState({}, '', newUrl);
            document.title = translations[lang].pageTitle;
            document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('active', b.dataset.langBtn === lang));
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (translations[lang][key]) elem.textContent = translations[lang][key];
            });
            updateReadouts(); // re-render dynamic text in current language
        }

        document.querySelectorAll('[data-lang-btn]').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.langBtn));
        });

        /* ---------------- Readouts (step 1: placeholders) ---------------- */
        const slider = document.getElementById('tempSlider');
        const readout = document.getElementById('tempReadout');
        let targetTempK = 300;

        function fmtTemp(t) {
            return 'T = ' + t + ' K (' + Math.round(t - 273.15) + ' °C)';
        }

        function updateReadouts() {
            readout.textContent = fmtTemp(targetTempK);
        }

        slider.addEventListener('input', function () {
            targetTempK = parseInt(this.value, 10);
            updateReadouts();
        });

        document.querySelectorAll('.preset').forEach(btn => {
            btn.addEventListener('click', function () {
                targetTempK = parseInt(this.dataset.preset, 10);
                slider.value = targetTempK;
                updateReadouts();
            });
        });

        /* Static placeholders for values filled by step 2. */
        const defaultKE = '1.6';
        const defaultRMS = '190';
        document.getElementById('keValue').textContent = defaultKE;
        document.getElementById('rmsValue').textContent = defaultRMS;

        /* ---------------- Cohesive molecular-dynamics engine ----------------
           Generic for any van der Waals fluid (water now; nitrogen / argon later).
           There is no scripted phase morph: molecules attract and repel through a
           pair potential and are thermalised by a Langevin thermostat, so solid,
           liquid and gas all emerge from the SAME equations and every transition is
           continuous by construction (no site springs, no moving lids, no clamps). */

        // Real-chemistry constants - used only for the numeric readouts.
        const kB = 1.381e-23;
        const R = 8.314;

        // ---- Substance registry ------------------------------------------------
        // Particle mass is 1 and the well depth eps is stored as a characteristic
        // speed squared. The phase is set by the reduced temperature
        //   T* = (thermal speed)^2 / eps,
        // and the mapping below pins T*_freeze to meltK and T*_boil to boilK, so
        // each substance displays its own real melting / boiling points.
        // `count` keeps the reduced density N*sigma^2 and `gravity` keeps the reduced
        // gravity g*sigma/eps the same across substances, so one calibrated T* phase
        // diagram serves them all.
        const SUBSTANCES = {
            water: {
                id: 'water',
                molarMass: 0.018,      // kg/mol (readout only)
                meltK: 273,
                boilK: 373,
                sigma: 30,             // effective particle diameter, px
                eps: 7000,             // well depth, px^2/s^2 (speed scale)
                gravity: 93,           // px/s^2
                tFreeze: 0.47,         // reduced temperature at which it freezes
                tBoil: 1.10,           // reduced temperature at which it starts to boil
                tHot: 5.00,            // reduced temperature at 500 K (keeps gas lively)
                count: 150,
                shape: 'bent',         // H-O-H bent V
                radius: 7,             // drawn radius of the oxygen atom, px
                color: 'rgb(139,92,246)'
            },
            argon: {
                id: 'argon',
                molarMass: 0.03995,    // monatomic noble gas
                meltK: 84,
                boilK: 87,
                sigma: 38,             // larger atom than oxygen
                eps: 7000,
                gravity: 73,           // = 93 * 30/38, keeps g*sigma/eps constant
                tFreeze: 0.47,
                tBoil: 1.10,
                tHot: 5.00,
                count: 94,             // fewer, bigger atoms -> same reduced density
                shape: 'atom',         // single sphere
                radius: 11,            // drawn radius, larger than the oxygen atom
                color: 'rgb(56,189,248)'
            },
            nitrogen: {
                id: 'nitrogen',
                molarMass: 0.028014,   // diatomic N2
                meltK: 63,
                boilK: 77,
                sigma: 30,             // same atom size as the oxygen in water
                eps: 7000,
                gravity: 93,           // sigma = 30, so same reduced gravity as water
                tFreeze: 0.47,
                tBoil: 1.10,
                tHot: 5.00,
                count: 150,
                shape: 'diatomic',     // two bonded spheres
                radius: 7,             // each N atom the size of the oxygen atom
                color: 'rgb(74,222,128)'
            }
        };
        let SUBSTANCE = SUBSTANCES.water;

        // ---- Simulation parameters ----
        const CW = 800, CH = 500, BOUND = 16;   // container (px)
        const R_CUT = 2.5;        // pair-force cutoff, in sigma
        const R_CORE = 0.8;       // softened core: force stops growing inside this
        const GAMMA = 1;          // Langevin coupling, 1/s
        const SUBSTEPS = 8;       // integrator substeps per frame
        const A_MAX = 60000;      // acceleration cap for stability, px/s^2
        const BASE_ROT = 1.2;     // decorative spin at 300 K, rad/s

        let simTempK = 300;       // displayed/animated temperature (lerps to targetTempK)
        let phase = 'liquid';     // 'solid' | 'liquid' | 'gas'
        let pendingLabel = null;  // transient label such as 'melting'
        let labelUntil = 0;       // wall-clock ms until pendingLabel expires
        let paused = false;
        let molecules = [];
        // --- temperature mapping ------------------------------------------------
        function lerp(a, b, t) { return a + (b - a) * t; }

        function reducedTemp(T) {
            const cold = 0.01;
            if (T <= 1) return cold;
            if (T <= SUBSTANCE.meltK) {
                // Convex ramp: the solid stays slow for most of its range and picks up
                // speed only as it nears melting, so its motion reads calmer than the
                // liquid's. Continuous (and monotonic) all the way to the melting point.
                const f = (T - 1) / (SUBSTANCE.meltK - 1);
                return cold + (SUBSTANCE.tFreeze - cold) * Math.pow(f, 2.5);
            }
            if (T <= SUBSTANCE.boilK) return lerp(SUBSTANCE.tFreeze, SUBSTANCE.tBoil, (T - SUBSTANCE.meltK) / (SUBSTANCE.boilK - SUBSTANCE.meltK));
            return lerp(SUBSTANCE.tBoil, SUBSTANCE.tHot, (T - SUBSTANCE.boilK) / (500 - SUBSTANCE.boilK));
        }
        // Target thermal speed (px/s) for a displayed temperature.
        function thermalSpeed(k) { return Math.sqrt(reducedTemp(k) * SUBSTANCE.eps); }

        // Unit-variance Gaussian noise.
        function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) * 2; }

        // Start as a loose slab low in the box (about one condensed pool's worth).
        function initMolecules() {
            molecules = [];
            const N = SUBSTANCE.count;
            const spacing = SUBSTANCE.sigma * 1.15, dy = spacing * 0.87;
            const cols = Math.max(1, Math.min(N, Math.floor((CW - 2 * BOUND) / spacing)));
            const rows = Math.ceil(N / cols);
            const x0 = (CW - (cols - 1) * spacing) / 2;
            const bottomY = CH - BOUND - 8;
            let n = 0;
            for (let r = 0; r < rows && n < N; r++) {
                const off = (r % 2) * spacing / 2;
                for (let c = 0; c < cols && n < N; c++, n++) {
                    const a = Math.random() * Math.PI * 2;
                    const speed = thermalSpeed(300) * (0.7 + Math.random() * 0.6);
                    molecules.push({
                        x: x0 + off + c * spacing + (Math.random() - 0.5) * 4,
                        y: bottomY - r * dy + (Math.random() - 0.5) * 4,
                        vx: Math.cos(a) * speed,
                        vy: Math.sin(a) * speed,
                        ax: 0, ay: 0,
                        rot: Math.random() * Math.PI * 2,
                        spin: Math.random() < 0.5 ? -1 : 1
                    });
                }
            }
        }

        // Lennard-Jones pair forces + gravity. Both particles of a pair get the
        // equal-and-opposite acceleration; the repulsive core is softened so a
        // chance overlap can never blow the integrator up.
        function computeForces() {
            const n = molecules.length;
            for (let i = 0; i < n; i++) { molecules[i].ax = 0; molecules[i].ay = SUBSTANCE.gravity; }
            const eps = SUBSTANCE.eps;
            const sig2 = SUBSTANCE.sigma * SUBSTANCE.sigma;
            const rc2 = (R_CUT * SUBSTANCE.sigma) * (R_CUT * SUBSTANCE.sigma);
            const core2 = (R_CORE * SUBSTANCE.sigma) * (R_CORE * SUBSTANCE.sigma);
            for (let i = 0; i < n - 1; i++) {
                const a = molecules[i];
                for (let j = i + 1; j < n; j++) {
                    const b = molecules[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const r2 = dx * dx + dy * dy;
                    if (r2 >= rc2 || r2 < 1e-6) continue;
                    const rr2 = r2 < core2 ? core2 : r2;
                    const sr2 = sig2 / rr2;
                    const sr6 = sr2 * sr2 * sr2;
                    const sr12 = sr6 * sr6;
                    const f = 24 * eps * (2 * sr12 - sr6) / rr2;   // 1/length^2
                    const fx = f * dx, fy = f * dy;                // acceleration
                    a.ax += fx; a.ay += fy;
                    b.ax -= fx; b.ay -= fy;
                }
            }
            for (let i = 0; i < n; i++) {
                const m = molecules[i];
                const a2 = m.ax * m.ax + m.ay * m.ay;
                if (a2 > A_MAX * A_MAX) {
                    const s = A_MAX / Math.sqrt(a2);
                    m.ax *= s; m.ay *= s;
                }
            }
        }

        // One physics step: Langevin thermostat, then symplectic (semi-implicit
        // Euler) integration in substeps with hard walls. Gravity is always on;
        // a fluid simply self-organises, so no gravity ramps are needed.
        function stepPhysics(dt) {
            const vth = thermalSpeed(simTempK);
            const c1 = Math.exp(-GAMMA * dt);
            const c2 = Math.sqrt(vth * vth * (1 - c1 * c1));
            for (let i = 0; i < molecules.length; i++) {
                const m = molecules[i];
                m.vx = m.vx * c1 + c2 * gauss();
                m.vy = m.vy * c1 + c2 * gauss();
            }
            const h = dt / SUBSTEPS;
            for (let s = 0; s < SUBSTEPS; s++) {
                computeForces();
                for (let i = 0; i < molecules.length; i++) {
                    const m = molecules[i];
                    m.vx += m.ax * h; m.vy += m.ay * h;
                    m.x += m.vx * h; m.y += m.vy * h;
                    if (m.x < BOUND) { m.x = BOUND; m.vx = Math.abs(m.vx); }
                    else if (m.x > CW - BOUND) { m.x = CW - BOUND; m.vx = -Math.abs(m.vx); }
                    if (m.y < BOUND) { m.y = BOUND; m.vy = Math.abs(m.vy); }
                    else if (m.y > CH - BOUND) { m.y = CH - BOUND; m.vy = -Math.abs(m.vy); }
                }
            }
            const spinRate = BASE_ROT * Math.sqrt(simTempK / 300);
            for (let i = 0; i < molecules.length; i++) {
                molecules[i].rot += spinRate * molecules[i].spin * dt;
            }
        }

        function updateReadoutsPhysics(now) {
            document.getElementById('keValue').textContent = (1.5 * kB * simTempK / 1e-21).toFixed(2);
            document.getElementById('rmsValue').textContent =
                Math.round(Math.sqrt(3 * R * simTempK / SUBSTANCE.molarMass));
            document.getElementById('structText').textContent =
                simTempK < SUBSTANCE.meltK ? translations[currentLang].structSolid
                   : simTempK < SUBSTANCE.boilK ? translations[currentLang].structLiquid
                   : translations[currentLang].structGas;
            const showLabel = pendingLabel && (now || 0) < labelUntil;
            document.getElementById('stateText').textContent =
                showLabel ? translations[currentLang][pendingLabel]
                    : simTempK < SUBSTANCE.meltK ? translations[currentLang].stateSolid
                       : simTempK < SUBSTANCE.boilK ? translations[currentLang].stateLiquid
                       : translations[currentLang].stateGas;
        }

        const H_RADIUS = 3;        // hydrogen atom size (water only)

        function drawMolecule(m) {
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.rot);
            const r = SUBSTANCE.radius;
            if (SUBSTANCE.shape === 'atom') {        // argon: a single, larger atom
                ctx.fillStyle = SUBSTANCE.color;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return;
            }
            if (SUBSTANCE.shape === 'diatomic') {    // nitrogen: two bonded spheres
                const off = r * 0.85;
                ctx.fillStyle = SUBSTANCE.color;
                ctx.beginPath();
                ctx.arc(-off, 0, r, 0, Math.PI * 2);
                ctx.arc(off, 0, r, 0, Math.PI * 2);
                ctx.fill();
                // subtle seam so the two atoms read as a pair, not one blob
                ctx.strokeStyle = 'rgba(2,6,23,0.45)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(-off, 0, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(off, 0, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                return;
            }
            // Water: bent H-O-H at 104.5 deg; the H atoms overlap the O (space-filling,
            // no bond sticks). Both H use the SAME hy (same side) => a bent V.
            const bond = r + H_RADIUS - 1;
            const half = 104.5 * Math.PI / 180 / 2;
            const hx = Math.sin(half) * bond, hy = -Math.cos(half) * bond;
            ctx.fillStyle = SUBSTANCE.color;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(hx, hy, H_RADIUS, 0, Math.PI * 2);
            ctx.arc(-hx, hy, H_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
            lastTime = now;

            simTempK += (targetTempK - simTempK) * Math.min(1, dt * 0.8);
            if (Math.abs(targetTempK - simTempK) < 0.5) simTempK = targetTempK;

            if (!paused) stepPhysics(dt);

            // The structure always physically relaxes; the label only announces which
            // boundary the displayed temperature has just crossed.
            const desired = simTempK < SUBSTANCE.meltK ? 'solid' : simTempK < SUBSTANCE.boilK ? 'liquid' : 'gas';
            if (desired !== phase) {
                pendingLabel = labelFor(phase, desired);
                labelUntil = now + 2000;
                phase = desired;
            }

            ctx.clearRect(0, 0, CW, CH);
            for (let i = 0; i < molecules.length; i++) drawMolecule(molecules[i]);

            updateReadoutsPhysics(now);
        }

        function labelFor(from, to) {
            if (from === 'solid' && to === 'liquid') return 'melting';
            if (from === 'liquid' && to === 'solid') return 'freezing';
            if (from === 'liquid' && to === 'gas') return 'boiling';
            if (from === 'gas' && to === 'liquid') return 'condensing';
            if (from === 'solid' && to === 'gas') return 'boiling'; // rare direct jumps
            if (from === 'gas' && to === 'solid') return 'desubliming';
            return 'melting';
        }

        const simCanvas = document.getElementById('simCanvas');
        const ctx = simCanvas.getContext('2d');
        let lastTime = performance.now();

        function togglePause() {
            paused = !paused;
            document.getElementById('pauseBtn').textContent =
                paused ? translations[currentLang].resumeBtn : translations[currentLang].pauseBtn;
        }

        // Switch between substances: each has its own real phase points, atom size
        // and particle count, so re-seed the particles and recompute the label.
        function setSubstance(id) {
            if (!SUBSTANCES[id]) return;
            SUBSTANCE = SUBSTANCES[id];
            document.querySelectorAll('[data-sub]').forEach(b =>
                b.classList.toggle('active', b.dataset.sub === id));
            pendingLabel = null;
            phase = simTempK < SUBSTANCE.meltK ? 'solid'
                  : simTempK < SUBSTANCE.boilK ? 'liquid' : 'gas';
            initMolecules();
            updateReadouts();
        }

        function resetSim() {
            targetTempK = 300;
            simTempK = 300;
            slider.value = 300;
            pendingLabel = null;
            phase = simTempK < SUBSTANCE.meltK ? 'solid'
                  : simTempK < SUBSTANCE.boilK ? 'liquid' : 'gas';
            initMolecules();
            updateReadouts();
        }
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resetBtn').addEventListener('click', resetSim);
        document.querySelectorAll('[data-sub]').forEach(btn =>
            btn.addEventListener('click', () => setSubstance(btn.dataset.sub)));

        // Boot.
        setLanguage(currentLang);
        setSubstance(SUBSTANCE.id);
        lastTime = performance.now();
        loop(lastTime);
    </script>
</body>
</html>
